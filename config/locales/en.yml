en:
  label_expert_ui_close_button: "Close button"
  field_expert_ui_close_button_enabled: "Show the close button"
  text_expert_ui_close_button_info: "A button next to Edit on the issue page that closes the issue with one click, together with a note typed into the edit form. Shown only when the workflow lets the user set that status."
  field_expert_ui_close_button_status: "Status set by the button"
  text_expert_ui_close_button_status_default: "First closed status (%{status})"
  text_expert_ui_close_title: "Set the status to %{status} and save"
  label_expert_ui_auto_refresh: "Automatic refresh"
  field_expert_ui_auto_refresh_enabled: "Offer the automatic refresh"
  text_expert_ui_auto_refresh_info: "A link on the issue list and on My page. Each user switches it on per page; the interval is set under My account."
  field_expert_ui_auto_refresh_default_interval: "Default interval"
  label_expert_ui_seconds: "seconds"
  label_expert_ui_refresh_in: "Refresh in %{seconds} s"
  text_expert_ui_auto_refresh_switch_on: "Reload this page every %{seconds} seconds"
  text_expert_ui_auto_refresh_switch_off: "Stop the automatic refresh"
  field_expert_ui_refresh_interval: "Automatic refresh every (seconds)"
  text_expert_ui_refresh_interval_info: "At least %{min} seconds. Empty: %{interval} seconds."
  text_expert_ui_legacy_installed: "The plugin %{plugin} is still installed, so this feature stays off. Remove that plugin and restart Redmine to use it."
  label_expert_ui_user_theme: "Theme per user"
  field_expert_ui_user_theme_enabled: "Let users choose their theme"
  text_expert_ui_user_theme_info: "A select box under My account. Users who choose nothing keep the theme set under Administration » Settings » Display."
  field_expert_ui_user_theme_choices: "Themes on offer"
  text_expert_ui_user_theme_choices_info: "None ticked: every installed theme."
  field_expert_ui_theme: "Theme"
  text_expert_ui_theme_default: "Default (%{theme})"
  project_module_expert_ui_cancel_guard: "Cancel guard"
  label_expert_ui_cancel_guard: "Cancel guard"
  text_expert_ui_cancel_guard_info: "Active in the projects that enable the module “%{module}” (project settings » Modules). Currently: %{count}."
  field_expert_ui_cancel_guard_default_style: "Default style"
  text_expert_ui_cancel_guard_styles_info: "Asked when Cancel would throw away text typed into the issue form or into an edited note. Users can pick their own style under My account."
  label_expert_ui_cancel_guard_style_confirm: "Confirm"
  label_expert_ui_cancel_guard_style_dodge: "Dodge"
  label_expert_ui_cancel_guard_style_slider: "Slide to cancel"
  label_expert_ui_cancel_guard_style_pour: "Pour out"
  label_expert_ui_cancel_guard_style_hold: "Press and hold"
  label_expert_ui_cancel_guard_style_shredder: "Shredder"
  label_expert_ui_cancel_guard_style_random: "Surprise me"
  field_expert_ui_cancel_guard_style: "Cancel guard"
  text_expert_ui_cancel_guard_style_default: "Default (%{style})"
