  text_expert_ui_cancel_guard_hold: "Press and hold to cancel"
  text_expert_ui_cancel_guard_shredder: "Shredding your text…"
  button_expert_ui_cancel_guard_stop: "Stop!"
  text_expert_ui_cancel_guard_saved: "Saved. Your text is still there."
