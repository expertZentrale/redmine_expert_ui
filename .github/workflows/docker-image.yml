name: Docker image smoke test

# Complements the source based CI (ci.yml): tests the plugin against the
# *official* Redmine Docker images (https://hub.docker.com/_/redmine) - the very
# images we deploy with. For each tag the official image is started with a fresh
# MariaDB, the plugin is mounted in and REDMINE_PLUGINS_MIGRATE stays on (no migrations yet).
#
# The official entrypoint runs with `set -Eeo pipefail`: if a core or plugin
# migration fails, or init.rb raises while loading, the container exits and the
# site never comes up. A successful `/login` (HTTP 200) therefore proves that the
# plugin loads cleanly in the production image. On top of that we sign in and
# check that the issue list and My page link the plugin's script and stylesheet
# and that both are served (the asset layout differs between 5.1 and 6/7).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: redmine:${{ matrix.tag }} (official image)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Currently published, supported Redmine tags on Docker Hub.
        tag: [ '5.1', '6.0', '6.1', '7.0' ]

    env:
      DB_NAME: redmine
      DB_PASS: root

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: redmine_expert_ui

      - name: Create docker network
        run: docker network create rmnet

      - name: Start MariaDB
        run: |
          docker run -d --name db --network rmnet \
            -e MARIADB_ROOT_PASSWORD="$DB_PASS" \
            -e MARIADB_DATABASE="$DB_NAME" \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            mariadb:11.4 --transaction-isolation=READ-COMMITTED

      - name: Wait for MariaDB to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' db 2>/dev/null || echo starting)
            echo "attempt $i: db health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "MariaDB did not become healthy in time"; docker logs db; exit 1

      - name: Start official Redmine ${{ matrix.tag }} with the plugin
        run: |
          docker run -d --name redmine --network rmnet -p 3000:3000 \
            -e REDMINE_DB_MYSQL=db \
            -e REDMINE_DB_DATABASE="$DB_NAME" \
            -e REDMINE_DB_USERNAME=root \
            -e REDMINE_DB_PASSWORD="$DB_PASS" \
            -e REDMINE_PLUGINS_MIGRATE=1 \
            -v "$GITHUB_WORKSPACE/redmine_expert_ui:/usr/src/redmine/plugins/redmine_expert_ui:ro" \
            redmine:${{ matrix.tag }}

      - name: Wait for Redmine to boot (migrations + init.rb load)
        run: |
          code=000
          for i in $(seq 1 60); do
            # If the container dies (failed migration / init.rb), fail right away.
            if [ "$(docker inspect -f '{{.State.Running}}' redmine 2>/dev/null)" != "true" ]; then
              echo "Redmine container exited early - dumping logs:"; docker logs redmine; exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            echo "attempt $i: GET /login -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "Timed out waiting for Redmine to serve /login"; docker logs redmine; exit 1; }

      # The plugin has no migrations, and its assets load only for signed-in
      # users on the issue list, the issue page and My page. A one-off
      # container on the same database sets the admin password (a fresh install
      # asks for a new one at the first sign-in), then curl signs in.
      - name: Sign in as admin
        run: |
          docker run --rm --network rmnet \
            -e REDMINE_DB_MYSQL=db \
            -e REDMINE_DB_DATABASE="$DB_NAME" \
            -e REDMINE_DB_USERNAME=root \
            -e REDMINE_DB_PASSWORD="$DB_PASS" \
            -v "$GITHUB_WORKSPACE/redmine_expert_ui:/usr/src/redmine/plugins/redmine_expert_ui:ro" \
            redmine:${{ matrix.tag }} \
            rails runner "u = User.find_by_login('admin'); u.password = u.password_confirmation = 'smoke-test-1234'; u.must_change_passwd = false; u.save!"
          curl -sS -c jar -b jar http://localhost:3000/login -o login.html
          token=$(grep -oE 'name="authenticity_token" value="[^"]+"' login.html | head -n 1 | sed -E 's/.*value="([^"]+)"/\1/')
          [ -n "$token" ] || { echo "No CSRF token on /login"; exit 1; }
          code=$(curl -sS -c jar -b jar -o /dev/null -w '%{http_code}' \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "username=admin" \
            --data-urlencode "password=smoke-test-1234" \
            http://localhost:3000/login)
          echo "POST /login -> HTTP $code"
          [ "$code" = "302" ] || { echo "Sign-in failed"; exit 1; }

      - name: Assert the issue list and My page load the automatic refresh
        run: |
          fail() {
            echo "$1"
            sed -n '1,60p' page.html
            docker logs redmine
            exit 1
          }
          : > assets.txt
          for path in /issues /my/page; do
            curl -sS -b jar "http://localhost:3000${path}" -o page.html
            grep -q 'expert-ui-auto-refresh-config' page.html \
              || fail "${path}: the automatic refresh settings are missing:"
            # Redmine 6 and 7 fingerprint plugin assets (expert_ui_auto_refresh-<digest>.js)
            # while 5.1 serves them under the plain name, so match the stem.
            grep -Eq 'expert_ui_auto_refresh[^"]*\.js' page.html \
              || fail "${path}: the automatic refresh script is not linked:"
            grep -Eq 'expert_ui[^"]*\.css' page.html \
              || fail "${path}: the stylesheet is not linked:"
            grep -oE '/[^"]*expert_ui[^"]*\.(js|css)' page.html >> assets.txt
          done
          echo "Issue list and My page link script and stylesheet."

      - name: Assert the referenced assets are actually served
        run: |
          sort -u assets.txt -o assets.txt
          [ -s assets.txt ] || { echo "No asset URLs in the pages"; exit 1; }
          while read -r asset; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${asset}" || true)
            echo "GET ${asset} -> HTTP $code"
            [ "$code" = "200" ] || {
              echo "Plugin asset was not served"; docker logs redmine; exit 1; }
          done < assets.txt

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== redmine logs ====="; docker logs redmine 2>&1 || true
          echo "===== db logs ====="; docker logs db 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f redmine db 2>/dev/null || true
          docker network rm rmnet 2>/dev/null || true
