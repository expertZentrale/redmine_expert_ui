name: Bug report
description: Report a problem with the expert UI plugin
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I am running the latest release of the plugin
          required: true
        - label: Redmine was restarted after installing or updating the plugin
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open an issue
        2. Click "Close"
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Close button
        - Automatic refresh
        - Settings / My account
        - Installation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Redmine version, Ruby version, browser, and other installed plugins.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: production.log around the problem, or the browser console.
      render: text
